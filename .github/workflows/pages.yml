name: Publish mathematics website
on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted, released, unreleased]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  # Only an explicit recovery push interrupts an older publication.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[restart-pages]') }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standard LaTeX rendering tools
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Keep only reachable official mirrors, preserving apt signature checks.
          source /etc/os-release
          test -f /etc/apt/apt-mirrors.txt
          mirror_list=$(mktemp)
          trap 'rm -f "$mirror_list"' EXIT
          priority=0
          for mirror in https://archive.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu https://security.ubuntu.com/ubuntu; do
            if curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 \
              "$mirror/dists/$VERSION_CODENAME/InRelease" --output /dev/null; then
              priority=$((priority + 1))
              printf '%s/\tpriority:%s\n' "$mirror" "$priority" >> "$mirror_list"
            else
              echo "::warning::Ubuntu mirror unavailable: $mirror"
            fi
          done
          if [[ ! -s "$mirror_list" ]]; then
            echo '::error::No official Ubuntu mirror is reachable; stopping before apt installation.'
            exit 1
          fi
          sudo install -m 644 "$mirror_list" /etc/apt/apt-mirrors.txt
          cat "$mirror_list"
          apt_network=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo timeout --kill-after=15s 180s apt-get "${apt_network[@]}" -o APT::Update::Error-Mode=any update
          sudo --preserve-env=DEBIAN_FRONTEND timeout --kill-after=15s 450s apt-get "${apt_network[@]}" install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended poppler-utils poppler-data
      - uses: actions/cache@v4
        with:
          path: .latex-cache
          key: latex-${{ runner.os }}-${{ hashFiles('src/latexMath.ts', 'assets/fonts/fandol/*.otf', 'content/**/*.md') }}
          restore-keys: latex-${{ runner.os }}-
      - name: Install pinned dependencies
        run: npm ci
      - run: npm run check
      - name: Verify required math fonts before compiling all equations
        run: node --import tsx --test --test-name-pattern="standard LaTeX" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/github-test-reporter.mjs --test-reporter-destination=stdout scripts/math.test.ts
      - name: Prepare formula cache in bounded parallel workers
        run: node --import tsx scripts/precompile-math.ts
      - name: Test with actionable failure annotations
        run: node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/github-test-reporter.mjs --test-reporter-destination=stdout scripts/*.test.ts
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
