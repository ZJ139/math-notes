name: Restore verified cloud source
on:
  push:
    paths: [.github/workflows/restore-cloud-source.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore original website files
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path.cwd()
          assert os.environ['GITHUB_REPOSITORY'] == 'ZJ139/math-notes'
          manifest = json.loads((root/'restore-manifest.json').read_text())
          assert manifest['destination'] == 'ZJ139/math-notes'
          archive = pathlib.Path('/tmp/math-notes-source.tar.gz')
          with archive.open('wb') as target:
              for name in manifest['parts']:
                  assert pathlib.Path(name).name == name
                  target.write((root/name).read_bytes())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['archive_sha256']
          expected = {item['path']: item['sha256'] for item in manifest['files']}
          with tarfile.open(archive, 'r:gz') as source:
              members = source.getmembers()
              assert len(members) == manifest['file_count'] == len(expected)
              assert {item.name for item in members} == set(expected)
              for item in members:
                  path = pathlib.PurePosixPath(item.name)
                  assert item.isfile() and not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  data = source.extractfile(item).read()
                  assert hashlib.sha256(data).hexdigest() == expected[item.name]
                  target = root/item.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(item.mode)
          for name in manifest['parts']:
              (root/name).unlink()
          (root/'restore-manifest.json').unlink()
          print(f"Restored and verified {len(expected)} source files from {manifest['source_commit']}.")
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/pages.yml' ':!.github/workflows/restore-cloud-source.yml'
          git commit -m 'Restore verified original website source and all attachments'
          git push origin HEAD:main
